name: Verify rubric bundle

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-lock.txt "pytest>=8,<9"
      - name: Verify Workbench pin
        run: python scripts/vendor_from_workbench.py --check
      - name: Run tests
        run: python -m pytest

  release-inputs:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build the release asset for this commit
        run: python scripts/make_release_asset.py --ref "$GITHUB_SHA"
      - name: Verify the sidecar checksum
        run: cd dist && sha256sum -c *.sha256
