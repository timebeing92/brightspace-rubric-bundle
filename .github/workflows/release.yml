name: Publish rubric bundle release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Verify annotated tag, version, and release notes
        shell: bash
        run: |
          test "$(git cat-file -t "$GITHUB_REF_NAME")" = "tag"
          version="$(tr -d '\n' < VERSION)"
          test "$GITHUB_REF_NAME" = "v$version"
          test -f "docs/releases/$GITHUB_REF_NAME.md"
      - name: Install verification dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-lock.txt "pytest>=8,<9"
      - name: Verify Workbench pin
        run: python scripts/vendor_from_workbench.py --check
      - name: Run tests
        run: python -m pytest
      - name: Build deterministic release assets
        run: python scripts/make_release_asset.py --ref "$GITHUB_REF_NAME"
      - name: Verify release checksum
        run: cd dist && sha256sum -c *.sha256
      - name: Retain release assets with the workflow run
        uses: actions/upload-artifact@v6
        with:
          name: rubric-bundle-${{ github.ref_name }}
          path: |
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error
          retention-days: 30
      - name: Publish immutable GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/*.tar.gz \
            dist/*.sha256 \
            --verify-tag \
            --title "Rubric Loom Bundle $GITHUB_REF_NAME" \
            --notes-file "docs/releases/$GITHUB_REF_NAME.md"
